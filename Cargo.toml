[workspace]
resolver = "2"
members = [
  "crates/env-core",
  "crates/env-broker",
  "crates/env-provider",
  "crates/env-remote-verifier",
  "crates/env-team",
  "crates/env-test-support",
  "src-tauri",
]

[workspace.package]
version = "0.6.4"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
age = "0.12.1"
aws-config = "=1.8.1"
aws-sdk-kms = "=1.115.0"
aws-sdk-secretsmanager = "=1.112.0"
aws-sdk-ssm = "=1.119.0"
aws-sdk-sts = "=1.111.0"
arboard = "3.6"
blake3 = "1.8"
directories = "6.0"
notify = "8.2"
proptest = "1.8"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"
semver = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
thiserror = "2.0"
toml = "1.1"
wait-timeout = "0.2"
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
