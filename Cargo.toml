[workspace]
resolver = "2"
members = [
  "crates/env-core",
  "crates/env-broker",
  "crates/env-test-support",
  "src-tauri",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
age = "0.12.1"
arboard = "3.6"
blake3 = "1.8"
directories = "6.0"
notify = "8.2"
proptest = "1.8"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
