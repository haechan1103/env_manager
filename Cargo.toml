[workspace]
resolver = "2"
members = [
  "crates/env-core",
  "crates/env-credentials",
  "crates/env-registry",
  "crates/env-broker",
  "crates/env-provider",
  "crates/env-remote-verifier",
  "crates/env-team",
  "crates/env-test-support",
  "src-tauri",
]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT"
rust-version = "1.94.1"

[workspace.dependencies]
age = "0.12.1"
aws-config = "=1.8.1"
aws-sdk-kms = { version = "=1.93.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "=1.93.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "=1.99.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "=1.91.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
arboard = "3.6"
blake3 = "1.8"
directories = "6.0"
getrandom = "0.4"
keyring = "4.2.0"
notify = "8.2"
portable-pty = "=0.9.0"
proptest = "1.8"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
semver = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread"] }
thiserror = "2.0"
toml = "0.9"
wait-timeout = "0.2"
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
