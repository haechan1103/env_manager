interface:
  display_name: "Manage Project Env"
  short_description: "Manage, share, deploy, and use registered environment variables safely"
  default_prompt: "Use $manage-project-env to inspect, update, generate, share, deploy, compare, or run an installed Action Pack with registered environment configuration safely."
dependencies:
  tools:
    - type: "mcp"
      value: "env-manager"
      description: "Redacted local broker for registered env and provider operations"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
