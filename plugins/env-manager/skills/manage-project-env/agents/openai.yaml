interface:
  display_name: "Manage Project Env"
  short_description: "Manage, share, deploy, and compare registered environment variables"
  default_prompt: "Use $manage-project-env to inspect, update, share, deploy, or compare registered deployment and Runtime environment configuration safely."
dependencies:
  tools:
    - type: "mcp"
      value: "env-manager"
      description: "Redacted local broker for registered env and provider operations"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
