interface:
  display_name: "Kavranta Env Management"
  short_description: "Safely manage registered env files with Kavranta"
  default_prompt: "Use $manage-project-env to inspect and safely manage this project's environment variables with Kavranta; 한국어 요청도 같은 보호 흐름으로 처리해줘."
dependencies:
  tools:
    - type: "mcp"
      value: "env-manager"
      description: "Redacted local broker for registered env and provider operations"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
