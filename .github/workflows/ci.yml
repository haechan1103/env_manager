name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm run validate:agent-bundle
      - run: npm run validate:release-version
      - run: cargo fmt --all -- --check
      - run: cargo test -p env-core -p env-broker -p env-test-support --locked
      - run: cargo clippy -p env-core -p env-broker -p env-test-support --all-targets --locked -- -D warnings

  macos-bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build
      - name: Verify bundled broker
        run: test -x "target/release/bundle/macos/Env Manager.app/Contents/MacOS/env-manager-broker"
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      - name: Install Windows package and verify bundled broker
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not created" }
          $installDir = Join-Path $env:RUNNER_TEMP "env-manager-windows-test"
          & $installer.FullName /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer failed" }
          $app = Get-ChildItem $installDir -Recurse -Filter "Env Manager.exe" | Select-Object -First 1
          if (-not $app) { throw "Installed application executable was not found" }
          $broker = Get-ChildItem $installDir -Recurse -Filter "env-manager-broker.exe" | Select-Object -First 1
          if (-not $broker) { throw "Installed broker sidecar was not found" }
          & $broker.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Windows broker sidecar did not run" }
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
