name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-23
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm run check
      - run: npm run validate:agent-bundle
      - run: npm run validate:release-version
      - run: npm run validate:provider-catalog
      - run: cargo fmt --all -- --check
      - run: cargo test -p env-core -p env-broker -p env-test-support --locked
      - run: cargo clippy -p env-core -p env-broker -p env-test-support --all-targets --locked -- -D warnings

  macos-bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-23
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm run tauri build
      - name: Verify bundled broker
        run: test -x "target/release/bundle/macos/Env Manager.app/Contents/MacOS/env-manager-broker"
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-23
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - name: Test Windows provider transports
        run: cargo test -p env-provider --locked
      - run: npm run tauri build -- --bundles nsis
      - name: Install Windows package and verify bundled broker
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not created" }

          # GitHub's Windows Server runner does not include the desktop WebView2
          # runtime. Mark it as present only for this ephemeral installer smoke
          # test so the production installer can retain its normal bootstrapper.
          $webviewKey = "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          New-Item -Path $webviewKey -Force | Out-Null
          New-ItemProperty -Path $webviewKey -Name "pv" -Value "999.0.0.0" -PropertyType String -Force | Out-Null

          $installDir = Join-Path $env:LOCALAPPDATA "Env Manager"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($process.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -Filter "env-manager-app.exe" | Select-Object -First 1
          if (-not $app) { throw "Installed application executable was not found" }
          $broker = Get-ChildItem $installDir -Recurse -Filter "env-manager-broker.exe" | Select-Object -First 1
          if (-not $broker) { throw "Installed broker sidecar was not found" }
          & $broker.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Windows broker sidecar did not run" }
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
