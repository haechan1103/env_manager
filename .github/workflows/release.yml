name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    permissions:
      attestations: write
      contents: write
      id-token: write
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-14
    env:
      ENV_MANAGER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-23
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run validate:public-boundary
      - run: npm run validate:agent-bundle
      - run: npm run validate:release-version
      - run: npm run validate:provider-catalog

      - name: Require Apple distribution credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            KEYCHAIN_PASSWORD \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_PRIVATE_KEY
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required Apple release secrets: ${missing[*]}" >&2
            exit 1
          fi
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
            echo "APPLE_SIGNING_IDENTITY must name a Developer ID Application certificate." >&2
            exit 1
          fi

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/env-manager-developer-id.p12"
          keychain_path="$RUNNER_TEMP/env-manager-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null; then
            echo "The imported keychain does not contain APPLE_SIGNING_IDENTITY." >&2
            exit 1
          fi
          rm -f "$certificate_path"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "ENV_MANAGER_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Configure Apple notarization
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          private_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$private_key_path"
          chmod 600 "$private_key_path"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"
          echo "ENV_MANAGER_NOTARY_KEY_PATH=$private_key_path" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Env Manager v__VERSION__
          releaseBody: |
            Env Manager v__VERSION__ for macOS and Windows.

            - Windows 10/11 (x64): download the `x64-setup.exe` installer
            - Apple Silicon: download the aarch64 DMG
            - Intel Mac: download the x86_64 DMG
            - The app opens in English by default and also supports Korean.
            - Exchange immutable encrypted packages through a mounted NAS or existing sync folder, then review conflicts before applying.
            - Push selected values to AWS Secrets Manager or SSM Parameter Store with optional KMS keys.
            - Compare supported AWS and allowlisted SSH Runtime targets without returning values or fingerprints to the UI.
            - Add local Personal Provider Packs for stdin-only custom CLI integrations.
            - Use the same redacted provider-push flow from supported AI coding agents.
            - Reuse a protected same-name value across registered projects without exposing it to the agent.

            ---

            Env Manager v__VERSION__ Windows 및 macOS 설치 파일입니다.

            - Windows 10/11(x64): `x64-setup.exe` 설치 파일
            - Apple Silicon: aarch64 DMG
            - Intel Mac: x86_64 DMG
            - 앱은 영어를 기본으로 열리며 한국어도 지원합니다.
            - 마운트한 NAS나 기존 동기화 폴더에서 변경 불가능한 암호화 패키지를 주고받고, 충돌 검토 후 적용할 수 있습니다.
            - 선택한 값을 KMS 키 옵션과 함께 AWS Secrets Manager 또는 SSM Parameter Store로 전송할 수 있습니다.
            - 지원 AWS 대상과 허용된 SSH Runtime을 실제 값이나 해시를 UI에 반환하지 않고 비교할 수 있습니다.
            - 표준 입력 전용 사용자 CLI 연동을 Personal Provider Pack으로 추가할 수 있습니다.
            - 지원 AI 코딩 에이전트에서도 같은 값 비노출 Provider 전송 흐름을 사용할 수 있습니다.
            - 같은 이름의 보호된 값을 에이전트에 노출하지 않고 등록 프로젝트 사이에서 재사용할 수 있습니다.
          generateReleaseNotes: true
          prerelease: false
          releaseDraft: true
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Verify signed and notarized macOS bundles
        run: |
          bundle_root="target/${{ matrix.target }}/release/bundle"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$app_path" || -z "$dmg_path" ]]; then
            echo "Expected macOS app and DMG bundles were not produced." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          codesign --display --verbose=4 "$app_path" 2>&1 | grep -F "Authority=Developer ID Application:" >/dev/null
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

          mount_point="$RUNNER_TEMP/env-manager-${{ matrix.target }}-dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          embedded_app="$(find "$mount_point" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$embedded_app" ]]; then
            echo "The DMG does not contain an app bundle." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$embedded_app"
          codesign --display --verbose=4 "$embedded_app" 2>&1 | grep -F "Authority=Developer ID Application:" >/dev/null
          spctl --assess --type execute --verbose=4 "$embedded_app"
          xcrun stapler validate "$embedded_app"
          if command -v syspolicy_check >/dev/null 2>&1; then
            syspolicy_check distribution "$embedded_app"
          fi

      - name: Attest macOS release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz

      - name: Remove temporary Apple signing material
        if: ${{ always() }}
        run: |
          if [[ -n "${ENV_MANAGER_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$ENV_MANAGER_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${ENV_MANAGER_NOTARY_KEY_PATH:-}" ]]; then
            rm -f "$ENV_MANAGER_NOTARY_KEY_PATH"
          fi

  windows:
    permissions:
      attestations: write
      contents: write
      id-token: write
    environment: release
    runs-on: windows-latest
    env:
      ENV_MANAGER_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-23
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run validate:public-boundary
      - run: npm run validate:agent-bundle
      - run: npm run validate:release-version
      - run: npm run validate:provider-catalog

      - name: Require Windows Artifact Signing credentials
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "AZURE_TENANT_ID",
            "AZURE_ARTIFACT_SIGNING_ENDPOINT",
            "AZURE_ARTIFACT_SIGNING_ACCOUNT",
            "AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE"
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required Windows release settings: $($missing -join ', ')"
          }
          $endpoint = [Uri]$env:AZURE_ARTIFACT_SIGNING_ENDPOINT
          if ($endpoint.Scheme -ne "https") {
            throw "AZURE_ARTIFACT_SIGNING_ENDPOINT must use HTTPS."
          }

      - name: Install pinned Artifact Signing CLI
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        with:
          tagName: v__VERSION__
          releaseName: Env Manager v__VERSION__
          releaseBody: |
            Env Manager v__VERSION__ for macOS and Windows.

            - Windows 10/11 (x64): download the `x64-setup.exe` installer
            - Apple Silicon: download the aarch64 DMG
            - Intel Mac: download the x86_64 DMG
            - The app opens in English by default and also supports Korean.
            - Exchange immutable encrypted packages through a mounted NAS or existing sync folder, then review conflicts before applying.
            - Push selected values to AWS Secrets Manager or SSM Parameter Store with optional KMS keys.
            - Compare supported AWS and allowlisted SSH Runtime targets without returning values or fingerprints to the UI.
            - Add local Personal Provider Packs for stdin-only custom CLI integrations.
            - Use the same redacted provider-push flow from supported AI coding agents.
            - Reuse a protected same-name value across registered projects without exposing it to the agent.

            ---

            Env Manager v__VERSION__ Windows 및 macOS 설치 파일입니다.

            - Windows 10/11(x64): `x64-setup.exe` 설치 파일
            - Apple Silicon: aarch64 DMG
            - Intel Mac: x86_64 DMG
            - 앱은 영어를 기본으로 열리며 한국어도 지원합니다.
            - 마운트한 NAS나 기존 동기화 폴더에서 변경 불가능한 암호화 패키지를 주고받고, 충돌 검토 후 적용할 수 있습니다.
            - 선택한 값을 KMS 키 옵션과 함께 AWS Secrets Manager 또는 SSM Parameter Store로 전송할 수 있습니다.
            - 지원 AWS 대상과 허용된 SSH Runtime을 실제 값이나 해시를 UI에 반환하지 않고 비교할 수 있습니다.
            - 표준 입력 전용 사용자 CLI 연동을 Personal Provider Pack으로 추가할 수 있습니다.
            - 지원 AI 코딩 에이전트에서도 같은 값 비노출 Provider 전송 흐름을 사용할 수 있습니다.
            - 같은 이름의 보호된 값을 에이전트에 노출하지 않고 등록 프로젝트 사이에서 재사용할 수 있습니다.
          generateReleaseNotes: true
          prerelease: false
          releaseDraft: true
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem "target/x86_64-pc-windows-msvc/release/env-manager-app.exe" -ErrorAction Stop
            Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" -ErrorAction Stop
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.Name): $($signature.Status)"
            }
            if (-not $signature.SignerCertificate) {
              throw "No Authenticode signer certificate found for $($file.Name)."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "No RFC 3161 timestamp found for $($file.Name)."
            }
          }

      - name: Attest Windows release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe

  publish-release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v$(jq -r '.version' package.json)"
          gh release edit "$release_tag" --draft=false --latest
