name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-14
    env:
      ENV_MANAGER_TARGET: ${{ matrix.target }}
      OPTIONAL_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run validate:public-boundary
      - run: npm run validate:agent-bundle
      - run: npm run validate:release-version
      - run: npm run validate:provider-catalog

      - name: Import Apple signing certificate
        if: ${{ env.OPTIONAL_APPLE_SIGNING_IDENTITY != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          echo "APPLE_SIGNING_IDENTITY=$OPTIONAL_APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure ad-hoc signing fallback
        if: ${{ env.OPTIONAL_APPLE_SIGNING_IDENTITY == '' }}
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Configure Apple notarization
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_APPLE_PASSWORD" && -n "$NOTARY_APPLE_TEAM_ID" ]]; then
            echo "APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$NOTARY_APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Env Manager v__VERSION__
          releaseBody: |
            Env Manager v__VERSION__ for macOS and Windows.

            - Windows 10/11 (x64): download the `x64-setup.exe` installer
            - Apple Silicon: download the aarch64 DMG
            - Intel Mac: download the x86_64 DMG
            - The app opens in English by default and also supports Korean.
            - Exchange immutable encrypted packages through a mounted NAS or existing sync folder, then review conflicts before applying.
            - Push selected values to AWS Secrets Manager or SSM Parameter Store with optional KMS keys.
            - Compare supported AWS and allowlisted SSH Runtime targets without returning values or fingerprints to the UI.
            - Add local Personal Provider Packs for stdin-only custom CLI integrations.
            - Use the same redacted provider-push flow from supported AI coding agents.
            - Reuse a protected same-name value across registered projects without exposing it to the agent.

            ---

            Env Manager v__VERSION__ Windows 및 macOS 설치 파일입니다.

            - Windows 10/11(x64): `x64-setup.exe` 설치 파일
            - Apple Silicon: aarch64 DMG
            - Intel Mac: x86_64 DMG
            - 앱은 영어를 기본으로 열리며 한국어도 지원합니다.
            - 마운트한 NAS나 기존 동기화 폴더에서 변경 불가능한 암호화 패키지를 주고받고, 충돌 검토 후 적용할 수 있습니다.
            - 선택한 값을 KMS 키 옵션과 함께 AWS Secrets Manager 또는 SSM Parameter Store로 전송할 수 있습니다.
            - 지원 AWS 대상과 허용된 SSH Runtime을 실제 값이나 해시를 UI에 반환하지 않고 비교할 수 있습니다.
            - 표준 입력 전용 사용자 CLI 연동을 Personal Provider Pack으로 추가할 수 있습니다.
            - 지원 AI 코딩 에이전트에서도 같은 값 비노출 Provider 전송 흐름을 사용할 수 있습니다.
            - 같은 이름의 보호된 값을 에이전트에 노출하지 않고 등록 프로젝트 사이에서 재사용할 수 있습니다.
          generateReleaseNotes: true
          prerelease: false
          releaseDraft: false
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.release.conf.json

  windows:
    runs-on: windows-latest
    env:
      ENV_MANAGER_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run validate:public-boundary
      - run: npm run validate:agent-bundle
      - run: npm run validate:release-version
      - run: npm run validate:provider-catalog

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Env Manager v__VERSION__
          releaseBody: |
            Env Manager v__VERSION__ for macOS and Windows.

            - Windows 10/11 (x64): download the `x64-setup.exe` installer
            - Apple Silicon: download the aarch64 DMG
            - Intel Mac: download the x86_64 DMG
            - The app opens in English by default and also supports Korean.
            - Exchange immutable encrypted packages through a mounted NAS or existing sync folder, then review conflicts before applying.
            - Push selected values to AWS Secrets Manager or SSM Parameter Store with optional KMS keys.
            - Compare supported AWS and allowlisted SSH Runtime targets without returning values or fingerprints to the UI.
            - Add local Personal Provider Packs for stdin-only custom CLI integrations.
            - Use the same redacted provider-push flow from supported AI coding agents.
            - Reuse a protected same-name value across registered projects without exposing it to the agent.

            ---

            Env Manager v__VERSION__ Windows 및 macOS 설치 파일입니다.

            - Windows 10/11(x64): `x64-setup.exe` 설치 파일
            - Apple Silicon: aarch64 DMG
            - Intel Mac: x86_64 DMG
            - 앱은 영어를 기본으로 열리며 한국어도 지원합니다.
            - 마운트한 NAS나 기존 동기화 폴더에서 변경 불가능한 암호화 패키지를 주고받고, 충돌 검토 후 적용할 수 있습니다.
            - 선택한 값을 KMS 키 옵션과 함께 AWS Secrets Manager 또는 SSM Parameter Store로 전송할 수 있습니다.
            - 지원 AWS 대상과 허용된 SSH Runtime을 실제 값이나 해시를 UI에 반환하지 않고 비교할 수 있습니다.
            - 표준 입력 전용 사용자 CLI 연동을 Personal Provider Pack으로 추가할 수 있습니다.
            - 지원 AI 코딩 에이전트에서도 같은 값 비노출 Provider 전송 흐름을 사용할 수 있습니다.
            - 같은 이름의 보호된 값을 에이전트에 노출하지 않고 등록 프로젝트 사이에서 재사용할 수 있습니다.
          generateReleaseNotes: true
          prerelease: false
          releaseDraft: false
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json
