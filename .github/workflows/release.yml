            - 표준 입력 전용 사용자 CLI 연동을 Personal Provider Pack으로 추가할 수 있습니다.
            - 지원 AI 코딩 에이전트에서도 같은 값 비노출 Provider 전송 흐름을 사용할 수 있습니다.
            - 같은 이름의 보호된 값을 에이전트에 노출하지 않고 등록 프로젝트 사이에서 재사용할 수 있습니다.
            - 선택한 값을 명령 인자·임시 파일·Kavranta 출력에 넣지 않고 EAS CLI 숨김 입력으로 Expo EAS 환경에 전송할 수 있습니다.
          generateReleaseNotes: true
          prerelease: false
          releaseDraft: true
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-beta.conf.json

      - name: Verify explicitly unsigned Windows beta
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem "target/x86_64-pc-windows-msvc/release/env-manager-app.exe" -ErrorAction Stop
            Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" -ErrorAction Stop
          )
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "Windows beta signing state changed for $($file.Name): $($signature.Status). Update the release policy and documentation before publishing."
            }
          }

      - name: Attest Windows release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe

  publish-release:
    needs: [macos, windows-beta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v$(jq -r '.version' package.json)"
          gh release edit "$release_tag" --draft=false --latest
